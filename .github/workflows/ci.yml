name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  checks: write
  contents: read
  issues: write
  pull-requests: write

jobs:
  checks:
    name: Lint, Type Check, and Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm check-types

      - name: Run web unit tests with coverage
        run: pnpm --filter web test:coverage

      - name: Publish web unit test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Web Unit Tests
          path: apps/web/test-results/vitest-junit.xml
          reporter: java-junit

      - name: Create web coverage summary
        if: always()
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const summaryPath = "apps/web/coverage/coverage-summary.json";
          if (!fs.existsSync(summaryPath)) {
            fs.writeFileSync(
              "apps/web/coverage-comment.md",
              "## Web Unit Test Coverage\n\nCoverage summary was not generated.\n",
            );
            process.exit(0);
          }

          const summary = JSON.parse(fs.readFileSync(summaryPath, "utf8"));
          const total = summary.total;
          const rows = [
            ["Statements", total.statements],
            ["Branches", total.branches],
            ["Functions", total.functions],
            ["Lines", total.lines],
          ];

          const table = [
            "## Web Unit Test Coverage",
            "",
            "| Metric | Coverage | Covered / Total |",
            "| --- | ---: | ---: |",
            ...rows.map(([label, metric]) => {
              return `| ${label} | ${metric.pct}% | ${metric.covered} / ${metric.total} |`;
            }),
            "",
          ].join("\n");

          fs.writeFileSync("apps/web/coverage-comment.md", `${table}\n`);
          NODE

          cat apps/web/coverage-comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment web coverage on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs");
            const marker = "<!-- web-unit-coverage -->";
            const coverage = fs.readFileSync("apps/web/coverage-comment.md", "utf8");
            const body = `${marker}\n${coverage}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
            });
            const existingComment = comments.find((comment) => {
              return comment.user.type === "Bot" && comment.body.includes(marker);
            });

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingComment.id,
                body,
              });
              return;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body,
            });

  e2e:
    name: Web E2E Tests
    runs-on: ubuntu-latest
    needs: checks

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Run web E2E tests
        run: pnpm --filter web test:e2e
        env:
          CI: true

      - name: Publish web E2E test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Web E2E Tests
          path: apps/web/test-results/playwright-junit.xml
          reporter: java-junit

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 30

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: apps/web/test-results
          retention-days: 30
