name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  checks: write
  contents: read
  issues: write
  pull-requests: write

jobs:
  monitoring:
    name: Monitoring Config Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate monitoring docker compose
        run: docker compose -f docker-compose.monitoring.yml config

      - name: Validate Prometheus config with promtool
        run: |
          docker run --rm \
            --entrypoint /bin/promtool \
            -v "$PWD/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            prom/prometheus:v3.5.0 \
            check config /etc/prometheus/prometheus.yml

      - name: Validate Grafana dashboard JSON
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const dashboardPath =
            "monitoring/grafana/dashboards/ai-logistics-observability.json";
          const raw = fs.readFileSync(dashboardPath, "utf8");
          const dashboard = JSON.parse(raw);

          if (dashboard.uid !== "ai-logistics-observability") {
            throw new Error(`Unexpected dashboard uid: ${dashboard.uid}`);
          }

          if (!Array.isArray(dashboard.panels) || dashboard.panels.length === 0) {
            throw new Error("Grafana dashboard must contain at least one panel.");
          }

          const invalidPanels = dashboard.panels.filter((panel) => {
            return panel.datasource?.uid !== "prometheus";
          });

          if (invalidPanels.length > 0) {
            throw new Error(
              `Panels with unexpected datasource uid: ${invalidPanels
                .map((panel) => panel.title || panel.id)
                .join(", ")}`,
            );
          }
          NODE

      - name: Start monitoring stack
        run: docker compose -f docker-compose.monitoring.yml up -d prometheus grafana

      - name: Wait for Prometheus and Grafana
        run: |
          node <<'NODE'
          const adminAuth = "Basic " + Buffer.from("admin:admin").toString("base64");

          async function waitFor(url, options = {}, isReady = (response) => response.ok) {
            const startedAt = Date.now();

            while (Date.now() - startedAt < 120000) {
              try {
                const response = await fetch(url, options);
                if (isReady(response)) return;
              } catch {}

              await new Promise((resolve) => setTimeout(resolve, 1000));
            }

            throw new Error(`Service did not become ready: ${url}`);
          }

          await waitFor("http://127.0.0.1:9090/-/healthy");
          await waitFor("http://127.0.0.1:3002/api/health");
          await waitFor("http://127.0.0.1:3002/api/datasources", {
            headers: { Authorization: adminAuth },
          });
          await waitFor(
            "http://127.0.0.1:3002/api/dashboards/uid/ai-logistics-observability",
            {
              headers: { Authorization: adminAuth },
            },
            (response) => response.ok,
          );
          NODE

      - name: Verify Grafana provisioning
        run: |
          node <<'NODE'
          const adminAuth = "Basic " + Buffer.from("admin:admin").toString("base64");

          const datasourceResponse = await fetch(
            "http://127.0.0.1:3002/api/datasources",
            {
              headers: { Authorization: adminAuth },
            },
          );
          const datasources = await datasourceResponse.json();
          const prometheus = datasources.find((entry) => entry.uid === "prometheus");

          if (!prometheus) {
            throw new Error("Provisioned Prometheus datasource uid=prometheus not found.");
          }

          const dashboardResponse = await fetch(
            "http://127.0.0.1:3002/api/dashboards/uid/ai-logistics-observability",
            {
              headers: { Authorization: adminAuth },
            },
          );

          if (!dashboardResponse.ok) {
            throw new Error(
              `Grafana dashboard fetch failed with status ${dashboardResponse.status}.`,
            );
          }

          const payload = await dashboardResponse.json();
          if (payload.dashboard?.uid !== "ai-logistics-observability") {
            throw new Error("Provisioned dashboard uid mismatch.");
          }
          NODE

      - name: Dump monitoring logs on failure
        if: failure()
        run: docker compose -f docker-compose.monitoring.yml logs --tail=200

      - name: Stop monitoring stack
        if: always()
        run: docker compose -f docker-compose.monitoring.yml down -v

  checks:
    name: Lint, Type Check, and Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm check-types

      - name: Run web unit tests with coverage
        run: pnpm --filter web test:coverage
        env:
          CI: true

      - name: Publish web unit test report
        if: always() && hashFiles('apps/web/test-results/vitest-junit.xml') != ''
        uses: dorny/test-reporter@v1
        with:
          name: Web Unit Tests
          path: apps/web/test-results/vitest-junit.xml
          reporter: java-junit

      - name: Create web coverage summary
        if: always()
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const summaryPath = "apps/web/coverage/coverage-summary.json";
          if (!fs.existsSync(summaryPath)) {
            fs.writeFileSync(
              "apps/web/coverage-comment.md",
              "## Web Unit Test Coverage\n\nCoverage summary was not generated.\n",
            );
            process.exit(0);
          }

          const summary = JSON.parse(fs.readFileSync(summaryPath, "utf8"));
          const total = summary.total;
          const rows = [
            ["Statements", total.statements],
            ["Branches", total.branches],
            ["Functions", total.functions],
            ["Lines", total.lines],
          ];

          const table = [
            "## Web Unit Test Coverage",
            "",
            "| Metric | Coverage | Covered / Total |",
            "| --- | ---: | ---: |",
            ...rows.map(([label, metric]) => {
              return `| ${label} | ${metric.pct}% | ${metric.covered} / ${metric.total} |`;
            }),
            "",
          ].join("\n");

          fs.writeFileSync("apps/web/coverage-comment.md", `${table}\n`);
          NODE

          cat apps/web/coverage-comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment web coverage on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs");
            const marker = "<!-- web-unit-coverage -->";
            const coverage = fs.readFileSync("apps/web/coverage-comment.md", "utf8");
            const body = `${marker}\n${coverage}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
            });
            const existingComment = comments.find((comment) => {
              return comment.user.type === "Bot" && comment.body.includes(marker);
            });

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingComment.id,
                body,
              });
              return;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body,
            });

      - name: Run API unit tests
        run: pnpm --filter api test
        env:
          CI: true

      - name: Publish API unit test report
        if: always() && hashFiles('apps/api/test-results/vitest-junit.xml') != ''
        uses: dorny/test-reporter@v1
        with:
          name: API Unit Tests
          path: apps/api/test-results/vitest-junit.xml
          reporter: java-junit

  e2e:
    name: Web E2E Tests
    runs-on: ubuntu-latest
    needs: checks

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Run web E2E tests
        run: pnpm --filter web test:e2e
        env:
          CI: true

      - name: Publish web E2E test report
        if: always() && hashFiles('apps/web/test-results/playwright-junit.xml') != ''
        uses: dorny/test-reporter@v1
        with:
          name: Web E2E Tests
          path: apps/web/test-results/playwright-junit.xml
          reporter: java-junit

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 30

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: apps/web/test-results
          retention-days: 30

  documents-e2e-real:
    name: Documents E2E Tests (Real MinIO)
    runs-on: ubuntu-latest
    needs: checks
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ai_logistics
          POSTGRES_USER: ai_logistics
          POSTGRES_PASSWORD: ai_logistics
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_logistics -d ai_logistics"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Start MinIO
        run: |
          docker run -d \
            --name ci-minio \
            -p 9000:9000 \
            -p 9001:9001 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            -v /tmp/minio-data:/data \
            minio/minio:latest server /data --console-address ":9001"

      - name: Create MinIO documents bucket
        run: |
          docker run --rm --network host --entrypoint /bin/sh minio/mc:latest -c '
            until mc alias set local http://127.0.0.1:9000 minioadmin minioadmin; do sleep 1; done &&
            mc mb --ignore-existing local/documents &&
            mc anonymous set none local/documents
          '

      - name: Run database migrations
        run: pnpm --filter api db:migrate
        env:
          DATABASE_URL: postgresql://ai_logistics:ai_logistics@127.0.0.1:5432/ai_logistics

      - name: Build API and web
        run: pnpm build

      - name: Start API
        run: |
          nohup pnpm --filter api start > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid
        env:
          NODE_ENV: test
          API_PORT: 3001
          WEB_ORIGIN: http://127.0.0.1:3000
          DATABASE_URL: postgresql://ai_logistics:ai_logistics@127.0.0.1:5432/ai_logistics
          JWT_ACCESS_SECRET: test-access-secret-1234567890123456
          JWT_REFRESH_SECRET: test-refresh-secret-123456789012345
          REDIS_URL: redis://127.0.0.1:6379
          STORAGE_PROVIDER: s3
          S3_ENDPOINT: http://127.0.0.1:9000
          S3_REGION: us-east-1
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: minioadmin
          S3_BUCKET: documents
          S3_PUBLIC_BASE_URL: http://127.0.0.1:9000
          S3_USE_SSL: "false"
          S3_PRESIGN_TTL_SECONDS: "900"
          OPENAI_DOCUMENT_MODEL: gpt-4.1-mini

      - name: Wait for API health
        run: |
          node <<'NODE'
          import fs from "node:fs";
          const apiHealthUrl = "http://127.0.0.1:3001/api/health";
          const apiLogPath = "/tmp/api.log";
          const apiPidPath = "/tmp/api.pid";
          const startedAt = Date.now();

          async function waitForHealth() {
            while (Date.now() - startedAt < 120000) {
              if (fs.existsSync(apiPidPath)) {
                const pid = Number(fs.readFileSync(apiPidPath, "utf8").trim());
                if (Number.isFinite(pid)) {
                  try {
                    process.kill(pid, 0);
                  } catch {
                    const apiLogs = fs.existsSync(apiLogPath)
                      ? fs.readFileSync(apiLogPath, "utf8")
                      : "API log file was not created.";
                    throw new Error(
                      `API process exited before becoming healthy.\n\n${apiLogs}`,
                    );
                  }
                }
              }

              try {
                const response = await fetch(apiHealthUrl);
                if (response.ok) return;
              } catch {}

              await new Promise((resolve) => setTimeout(resolve, 1000));
            }

            const apiLogs = fs.existsSync(apiLogPath)
              ? fs.readFileSync(apiLogPath, "utf8")
              : "API log file was not created.";
            throw new Error(
              `API did not become healthy at ${apiHealthUrl}\n\n${apiLogs}`,
            );
          }

          await waitForHealth();
          NODE

      - name: Start web
        run: |
          pnpm --filter web start > /tmp/web.log 2>&1 &
        env:
          NODE_ENV: test
          PORT: 3000
          API_BASE_URL: http://127.0.0.1:3001/api

      - name: Wait for web
        run: |
          node <<'NODE'
          const webUrl = "http://127.0.0.1:3000";
          const startedAt = Date.now();

          async function waitForWeb() {
            while (Date.now() - startedAt < 120000) {
              try {
                const response = await fetch(webUrl);
                if (response.ok) return;
              } catch {}

              await new Promise((resolve) => setTimeout(resolve, 1000));
            }

            throw new Error(`Web did not become ready at ${webUrl}`);
          }

          await waitForWeb();
          NODE

      - name: Run documents real E2E test
        run: pnpm --filter web test:e2e:documents:real
        env:
          CI: true
          DATABASE_URL: postgresql://ai_logistics:ai_logistics@127.0.0.1:5432/ai_logistics
          PLAYWRIGHT_REAL_API: "1"
          PLAYWRIGHT_REAL_API_HEALTH_URL: http://127.0.0.1:3001/api/health

      - name: Publish documents real E2E report
        if: always() && hashFiles('apps/web/test-results/playwright-junit.xml') != ''
        uses: dorny/test-reporter@v1
        with:
          name: Documents Real E2E Tests
          path: apps/web/test-results/playwright-junit.xml
          reporter: java-junit

      - name: Upload documents real Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documents-playwright-report
          path: apps/web/playwright-report
          retention-days: 30

      - name: Upload documents real Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documents-playwright-test-results
          path: apps/web/test-results
          retention-days: 30

      - name: Upload API and web logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documents-real-e2e-server-logs
          path: |
            /tmp/api.log
            /tmp/web.log
          retention-days: 30
