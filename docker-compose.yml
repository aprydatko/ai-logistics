services:
  redis:
    image: redis:7-alpine
    container_name: ai-logistics-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  postgres:
    image: postgres:17-alpine
    container_name: ai-logistics-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_logistics
      POSTGRES_USER: ai_logistics
      POSTGRES_PASSWORD: ai_logistics
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_logistics -d ai_logistics"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: ai-logistics-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-setup:
    image: minio/mc:latest
    container_name: ai-logistics-minio-setup
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done &&
      mc mb --ignore-existing local/documents &&
      mc anonymous set none local/documents
      "

volumes:
  postgres_data:
  minio_data:
