services:
  redis:
    image: redis:7-alpine
    container_name: ai-logistics-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  postgres:
    image: postgres:17-alpine
    container_name: ai-logistics-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_logistics
      POSTGRES_USER: ai_logistics
      POSTGRES_PASSWORD: ai_logistics
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_logistics -d ai_logistics"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
